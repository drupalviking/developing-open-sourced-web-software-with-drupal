  field_content:
    -
      value: "<p>Lens &amp; Trail is a small club for people in and around Edinburgh who like taking photos and going for walks, usually at the same time.</p><p>We meet twice a month: once for a hike in the Pentland Hills, along the coast or further into the Highlands, and once in a café in town to look at each other's photos over a cup of tea. We also go out at night now and then, to photograph the city lights from Calton Hill.</p><p>Many of our members came to Scotland from Spain and Latin America, so you'll hear as much Spanish as English on the trail. Everyone is welcome, whatever camera you have. A phone is fine!</p><p>The club has around forty members, and new ones join every month.</p>"
      format: content_format
  field_description:
    -
      value: 'Lens & Trail is a small club for people in and around Edinburgh who like taking photos and going for walks, usually at the same time.'
