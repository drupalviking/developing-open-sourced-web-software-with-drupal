        icon_size: large
        icon_align: center
        icon_style: primary_background
        text: 'Sturdy footwear'
        description:
          value: '<p>Broken-in hiking shoes or boots with good grip. Trail runners are fine for easy routes.</p>'
          format: canvas_html_block
        text_align: center
    -
      parent_uuid: ba1f2136-af45-4960-a6eb-b445fb583c7e
