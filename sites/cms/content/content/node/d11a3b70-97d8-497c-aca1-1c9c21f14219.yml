    field_content:
      -
        value: '<p>Lens &amp; Trail es un pequeño club para quienes viven en Edimburgo y sus alrededores y disfrutan de la fotografía y las caminatas, casi siempre a la vez.</p><p>Nos reunimos dos veces al mes: una para hacer una excursión por las Pentland Hills, por la costa o más lejos, en las Highlands, y otra en un café del centro para ver las fotos de todos con una taza de té. De vez en cuando también salimos de noche a fotografiar las luces de la ciudad desde Calton Hill.</p><p>Muchos de nuestros miembros llegaron a Escocia desde España y América Latina, así que en el camino se oye tanto español como inglés. Todo el mundo es bienvenido, tenga la cámara que tenga. ¡Un teléfono también sirve!</p><p>El club tiene unos cuarenta miembros, y cada mes se suman nuevos.</p>'
        format: content_format
    field_description:
      -
        value: 'Lens & Trail es un pequeño club para quienes viven en Edimburgo y sus alrededores y disfrutan de la fotografía y las caminatas, casi siempre a la vez.'
