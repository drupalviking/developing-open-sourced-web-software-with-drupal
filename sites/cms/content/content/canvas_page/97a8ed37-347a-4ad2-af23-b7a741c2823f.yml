      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>You do not need expensive gear. Pack these essentials and you will be comfortable from the first step to the last.</p>'
          format: canvas_html_block
        text_size: text-lg
        text_color: default
    -
      parent_uuid: ba1f2136-af45-4960-a6eb-b445fb583c7e
