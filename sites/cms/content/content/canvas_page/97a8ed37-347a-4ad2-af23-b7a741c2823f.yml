      uuid: 7485a2f9-a7e4-4f20-b31a-cc104ba8f42f
      component_id: sdc.mercury.accordion
      inputs:
        title: 'How fit do I need to be?'
        heading_level: 3
        open_by_default: true
    -
      parent_uuid: 7485a2f9-a7e4-4f20-b31a-cc104ba8f42f
      slot: accordion_content
      uuid: 4b407726-9136-4a68-9e87-44ffe42782af
      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>If you can walk for two to three hours on uneven ground, you will be fine. Beginner routes are 6 to 9 km with gentle elevation, and we always keep the group together.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 31ec3378-90b6-4c05-b199-62b7c3de22b1
      slot: accordion_content
      uuid: 31453315-edd2-450c-a222-4f13bb640abb
      component_id: sdc.mercury.accordion
      inputs:
        title: 'What if the weather turns bad?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 31453315-edd2-450c-a222-4f13bb640abb
      slot: accordion_content
      uuid: 972c2944-4710-43f0-b230-d4900e9e51ab
      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>Your hike leader checks the forecast the day before and emails everyone. If conditions are unsafe, we reschedule or switch to a sheltered route.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 31ec3378-90b6-4c05-b199-62b7c3de22b1
      slot: accordion_content
      uuid: 4bff36a3-d928-4f91-999d-cb4bc03355cf
      component_id: sdc.mercury.accordion
      inputs:
        title: 'Do I need a professional camera?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 4bff36a3-d928-4f91-999d-cb4bc03355cf
      slot: accordion_content
      uuid: b0be2212-add5-4c9e-b5ec-b5d6bc33ce4f
      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>Not at all. Phones, compacts and mirrorless cameras are all welcome. Members love sharing tips, whatever your equipment.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 31ec3378-90b6-4c05-b199-62b7c3de22b1
      slot: accordion_content
      uuid: 9d0c5c2f-4a55-4434-939a-5716329a9a97
      component_id: sdc.mercury.accordion
      inputs:
        title: 'Can I bring a friend or my dog?'
        heading_level: 3
        open_by_default: false
    -
      parent_uuid: 9d0c5c2f-4a55-4434-939a-5716329a9a97
      slot: accordion_content
      uuid: 03419d7d-c56d-45d6-865c-ce1939ce3824
      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>Friends are very welcome, just register them too. Dogs are welcome on selected routes when kept on a lead. Check the hike description before booking.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
