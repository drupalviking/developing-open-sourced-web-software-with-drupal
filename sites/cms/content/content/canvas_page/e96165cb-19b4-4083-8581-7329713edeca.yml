        component_id: sdc.mercury.text
        inputs:
          text:
            value: '<p>Antes de nada, ven a una de nuestras excursiones o tardes de fotografía para ver si el club es para ti. No hace falta avisar.</p><p>Si quieres hacerte miembro, habla con la secretaría ese mismo día o escribe a hello@lens-and-trail-cms.ddev.site.</p><p>La cuota es de 20 £ al año (10 £ para estudiantes). Cubre la sala de las tardes de fotografía y el seguro del club para las excursiones.</p>'
            format: canvas_html_block
          text_size: normal
          text_color: default
