          configuration:
            data: '0'
        eca_void_and_condition_0mr4y0c:
          label: and
        eca_switch_account_1q56yux:
          label: 'Temporarily become administrator'
  -
    name: eca.eca.define_breakpoints
    data:
      third_party_settings:
        modeler_api:
          label: 'Define custom breakpoints'
          documentation: 'Defines custom breakpoints for responsive images.'
      events:
        eca_render__breakpoints_alter_1ni95xs:
          label: 'Alter breakpoint'
      actions:
        eca_render_alter_breakpoint_1ic6gni:
          label: 'Define small breakpoint'
          configuration:
            definition: |-
              label: Small
              mediaQuery: 'all and (min-width: 500px)'
              weight: 0
              multipliers:
                - 1x
              group: custom
        eca_render_alter_breakpoint_176h4yu:
          label: 'Define medium breakpoint'
          configuration:
            definition: |-
              label: Medium
              mediaQuery: 'all and (min-width: 700px)'
              weight: 1
              multipliers:
                - 1x
              group: custom
        eca_render_alter_breakpoint_1k0st1k:
          label: 'Define large breakpoint'
          configuration:
            definition: |-
              label: Large
              mediaQuery: 'all and (min-width: 1000px)'
              weight: 2
              multipliers:
                - 1x
              group: custom
        eca_render_alter_breakpoint_1e7f6zt:
          label: 'Define x-large breakpoint'
          configuration:
            definition: |-
              label: X-Large
              mediaQuery: 'all and (min-width: 1300px)'
              weight: 3
              multipliers:
                - 1x
              group: custom
  -
    name: eca.eca.grant_media_type_permissions
    data:
