            title: 'Publishing content'
            fields:
              node_bulk_form:
                action_title: Action
              title:
                label: Title
                separator: ', '
              uid:
                label: Author
                separator: ', '
              created:
                label: 'Create date'
                separator: ', '
              changed:
                label: 'Updated date'
                separator: ', '
              status:
                label: Published
                separator: ', '
              operations:
                label: Operations
            pager:
              options:
                tags:
                  next: ››
                  previous: ‹‹
                  first: '« First'
                  last: 'Last »'
                expose:
                  items_per_page_label: 'Items per page'
                  items_per_page_options_all_label: '- All -'
                  offset_label: Offset
            exposed_form:
              options:
                submit_button: Apply
                reset_button_label: Reset
                exposed_sorts_label: 'Sort by'
                sort_asc_label: Asc
                sort_desc_label: Desc
            filters:
              moderation_state:
                expose:
                  label: 'Moderation state'
              uid:
                expose:
                  label: 'Authored by'
              combine:
                expose:
                  label: Contains
              type:
                expose:
                  label: Type
            use_more_text: more
        block_drafts:
          display_title: 'My drafts Block'
          display_options:
            title: 'My Drafts'
            fields:
              title:
                label: Title
                separator: ', '
              changed:
                label: 'Updated date'
                separator: ', '
              operations:
                label: Operations
            exposed_form:
              options:
                submit_button: Apply
                reset_button_label: Reset
                exposed_sorts_label: 'Sort by'
                sort_asc_label: Asc
                sort_desc_label: Desc
            empty:
              area_text_custom:
                content: 'No draft content authored by you. Only your drafts are listed here.'
            arguments:
              uid:
                exception:
                  title: All
            display_description: 'Shows a list of all draft content for the currently logged-in user.'
            use_more_text: 'See all drafts'
            link_url: /admin/content/moderated
            display_comment: 'Shows a list of all draft content for the currently logged-in user.'
            block_description: 'My drafts'
            block_category: Dashboard
        block_scheduled:
          display_title: 'Scheduled Block'
          display_options:
            title: Scheduled
            fields:
              title:
                label: Title
                separator: ', '
              unpublish_on:
                label: 'Unpublish on'
                separator: ', '
              publish_on:
                label: 'Scheduled On | Unpublished On'
                alter:
                  text: "{% if publish_on %}\r\n{{ publish_on }} |\r\n{% endif %}\r\n{% if unpublish_on %}\r\n {{ unpublish_on }}\r\n{% endif %}"
                separator: ', '
              operations:
                label: Operations
            exposed_form:
              options:
                submit_button: Apply
                reset_button_label: Reset
                exposed_sorts_label: 'Sort by'
                sort_asc_label: Asc
                sort_desc_label: Desc
            empty:
              area_text_custom:
                content: 'No scheduled content available. Only scheduled content is listed here.'
            filters:
              publish_on:
                expose:
                  label: 'Publish on'
              unpublish_on:
                expose:
                  label: 'Unpublish on'
