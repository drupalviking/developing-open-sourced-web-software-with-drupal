      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>Never joined one of our walks before? Welcome. Here is everything you need to know to feel prepared, confident and ready to enjoy a relaxed day outdoors with photographers and walkers who love the trail as much as the view.</p>'
