  field_body:
    -
      value: '<p>Two of the best-known tops in the Pentland Hills, with views over Edinburgh and the Firth of Forth on a clear day. We climb steadily from Flotterstone to Turnhouse Hill, follow the ridge to Carnethy Hill, and come back down through the glen.</p><p>Bring boots, a waterproof jacket, something warm, lunch, your camera, and a head torch: it gets dark before five in November. The path is steep in places and can be muddy.</p>'
