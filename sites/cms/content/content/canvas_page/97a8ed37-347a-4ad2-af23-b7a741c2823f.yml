        icon: drop
        icon_size: large
        icon_align: center
        icon_style: primary_background
        text: 'Water and snacks'
        description:
          value: '<p>At least one litre of water plus a lunch and a few energy snacks to share at the viewpoint.</p>'
          format: canvas_html_block
        text_align: center
    -
      parent_uuid: ba1f2136-af45-4960-a6eb-b445fb583c7e
