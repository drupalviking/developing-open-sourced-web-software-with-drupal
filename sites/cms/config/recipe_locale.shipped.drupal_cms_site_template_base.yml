            right: '1'
      actions:
        eca_void_and_condition_1:
          label: AND
        eca_void_and_condition_2:
          label: AND
        eca_switch_account_3:
          label: 'Switch to user 1'
        eca_token_load_entity_link:
          label: 'Load menu link'
          configuration:
            properties: 'uuid: d7f4f1b2-af94-46b8-ac63-a8a5b14fb0f5'
