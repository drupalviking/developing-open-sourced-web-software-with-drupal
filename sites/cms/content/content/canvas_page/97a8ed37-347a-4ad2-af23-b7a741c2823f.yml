        icon_align: center
        icon_style: primary_background
        text: 'Layers and rain gear'
        description:
          value: '<p>Weather changes quickly outdoors. Bring a light waterproof jacket, a warm layer and a hat.</p>'
          format: canvas_html_block
        text_align: center
    -
      parent_uuid: ba1f2136-af45-4960-a6eb-b445fb583c7e
