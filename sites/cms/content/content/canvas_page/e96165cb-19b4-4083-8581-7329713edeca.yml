      uuid: c7456efe-f48c-40f7-89a0-83d44c3269c5
      component_id: sdc.mercury.text
      inputs:
        text:
          value: "<p>Come along to one of our hikes or photo evenings first, to see whether the club is for you. You don't need to tell us in advance.</p><p>If you'd like to become a member, talk to the secretary on the day, or send an email to hello@lens-and-trail-cms.ddev.site.</p><p>Membership is £20 a year (£10 for students). It covers the room for the photo evenings and the club's insurance for the hikes.</p>"
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: 336b5e76-5471-4964-a7de-6780d228e491
      slot: main_slot
      uuid: 1e9d4716-3cca-479c-b5b8-ebbf5cf143f8
      component_id: sdc.mercury.card-icon
      inputs:
        border_radius: medium
        icon: calendar-dots
        icon_size: large
        icon_align: center
        text: 'When and where'
        description:
          value: '<p>Hikes: every other Saturday, at 9:30. We send the meeting place to everyone who is coming a week before.</p><p>Photo evenings: the first Thursday of the month, at 19:00, in the back room of a café in Leith.</p>'
          format: canvas_html_block
        text_align: left
