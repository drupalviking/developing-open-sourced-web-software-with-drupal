    -
      parent_uuid: b3d8191b-298b-4f14-9f96-bc8552bd83fe
      slot: hero_slot
      uuid: eff50ef9-07a5-470d-9aee-d847ab19099d
      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>Our first-timer hikes are friendly, unhurried and built around good light. Expect a group of 8 to 15 people, a relaxed pace of about 3 km per hour, and plenty of stops to take photos, catch your breath and enjoy the scenery.</p><ul><li>Meet your hike leader and the group at the trailhead 15 minutes before the start</li><li>A short safety briefing and route overview</li><li>Regular photo stops, with tips from experienced members if you want them</li><li>A shared lunch break at a scenic spot</li><li>Back at the car park by mid-afternoon</li></ul>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
      parent_uuid: b3d8191b-298b-4f14-9f96-bc8552bd83fe
