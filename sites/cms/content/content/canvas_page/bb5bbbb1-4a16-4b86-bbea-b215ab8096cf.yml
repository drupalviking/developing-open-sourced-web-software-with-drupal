      component_id: sdc.mercury.text
      inputs:
        text:
          value: '<p>We meet twice a month: once for a hike in the Pentland Hills, along the coast or further into the Highlands, and once in a café in Leith to look at each other''s photos.</p><p>Read more <a href="/about">about the club</a>, or find out <a href="/join">how to join</a>.</p>'
          format: canvas_html_block
        text_size: normal
        text_color: default
    -
