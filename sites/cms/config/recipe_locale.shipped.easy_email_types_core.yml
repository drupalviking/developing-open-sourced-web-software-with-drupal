recipe: 'Easy Email: Core Templates'
config:
  -
    name: easy_email.easy_email_type.user_activation
    data:
      label: 'User: Account Activation'
      subject: 'Account details for [easy_email:recipient_uid:0:entity:display-name] at [site:name] (approved)'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>Your account at [site:name] has been activated.</p><p>You may now log in by clicking this link or copying and pasting it into your browser:</p><p><a class="button" href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Log in and set your password</a></p><p>This link can only be used once to log in and will lead you to a page where you can set your password.</p><p>After setting your password, you will be able to log in at [site:login-url] in the future using:</p><p>username: [easy_email:recipient_uid:0:entity:account-name]<br>password: Your password</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nYour account at [site:name] has been activated.\r\n\r\nYou may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[easy_email:recipient_uid:0:entity:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [user:account-name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_blocked
    data:
      label: 'User: Account Blocked'
      subject: 'Account details for [easy_email:recipient_uid:0:entity:display-name] at [site:name] (blocked)'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>Your account on [site:name] has been blocked.</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nYour account on [site:name] has been blocked.\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_canceled
    data:
      label: 'User: Account Canceled'
      subject: 'Account details for [easy_email:recipient_uid:0:entity:display-name] at [site:name] (canceled)'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>Your account on [site:name] has been canceled.</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_cancellation_confirmation
    data:
      label: 'User: Account Cancellation Confirmation'
      subject: 'Account cancellation request for [easy_email:recipient_uid:0:entity:display-name] at [site:name]'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name]</p><p>A request to cancel your account has been made at [site:name].</p><p>You may now cancel your account on <a href="[site:url]">[site:url-brief]</a> by clicking this link:</p><p><a class="button danger" href="[easy_email:recipient_uid:0:entity:cancel-url]">Cancel your account</a></p><p><strong>NOTE: The cancellation of your account is not reversible.</strong></p><p>This link expires in one day and nothing will happen if it is not used.</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name]\r\n\r\nA request to cancel your account has been made at [site:name].\r\n\r\nYou may now cancel your account on [site:url-brief] by clicking this link or copying and pasting it into your browser:\r\n\r\n[easy_email:recipient_uid:0:entity:cancel-url]\r\n\r\nNOTE: The cancellation of your account is not reversible.\r\n\r\nThis link expires in one day and nothing will happen if it is not used.\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_created_approval_admin
    data:
      label: 'User: Created - Awaiting Approval - Admin Notification'
      recipient:
        - '[site:mail]'
      subject: 'Account details for [easy_email:field_related_user:0:entity:display-name] at [site:name] (pending admin approval)'
      bodyHtml:
        value: '<p>[easy_email:field_related_user:0:entity:display-name] has applied for an account.</p><p><a class="button" href="[easy_email:field_related_user:0:entity:edit-url]">Edit user account</a></p>'
      bodyPlain: "[easy_email:field_related_user:0:entity:display-name] has applied for an account.\r\n\r\n[easy_email:field_related_user:0:entity:edit-url]"
  -
    name: easy_email.easy_email_type.user_created_awaiting_approval
    data:
      label: 'User: Created - Awaiting Approval'
      subject: 'Account details for [easy_email:recipient_uid:0:entity:display-name] at [site:name] (pending admin approval)'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>Thank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nThank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been approved, you will receive another email containing information about how to log in, set your password, and other details.\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_created_by_admin
    data:
      label: 'User: Created - By Administrator'
      subject: 'An administrator created an account for you at [site:name]'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>A site administrator at [site:name] has created an account for you. You may now log in by clicking this link:</p><p><a class="button" href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Log in and set your password</a></p><p>This link can only be used once to log in and will lead you to a page where you can set your password.</p><p>After setting your password, you will be able to log in at <a href="[site:login-url]">[site:login-url]</a> in the future using:</p><p>username: [easy_email:recipient_uid:0:entity:account-name]<br>password: Your password</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nA site administrator at [site:name] has created an account for you. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[easy_email:recipient_uid:0:entity:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [easy_email:recipient_uid:0:entity:account-name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_created_no_approval
    data:
      label: 'User: Created - No Approval Required'
      subject: 'Account details for [easy_email:recipient_uid:0:entity:display-name] at [site:name]'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>Thank you for registering at [site:name]. You may now log in by clicking this link:</p><p><a class="button" href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Log in and set your password</a></p><p>This link can only be used once to log in and will lead you to a page where you can set your password.</p><p>After setting your password, you will be able to log in at <a href="[site:login-url]">[site:login-url]</a> in the future using:</p><p>username: [easy_email:recipient_uid:0:entity:name]<br>password: Your password</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nThank you for registering at [site:name]. You may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[easy_email:recipient_uid:0:entity:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password.\r\n\r\nAfter setting your password, you will be able to log in at [site:login-url] in the future using:\r\n\r\nusername: [easy_email:recipient_uid:0:entity:name]\r\npassword: Your password\r\n\r\n--  [site:name] team"
  -
    name: easy_email.easy_email_type.user_password_recovery
    data:
      label: 'User: Password Recovery'
      subject: 'Replacement login information for [easy_email:recipient_uid:0:entity:display-name] at [site:name]'
      bodyHtml:
        value: '<p>[easy_email:recipient_uid:0:entity:display-name],</p><p>A request to reset the password for your account has been made at [site:name].</p><p>You may now log in by clicking this link:</p><p><a class="button" href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Log in and reset your password</a></p><p>This link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it''s not used.</p><p>-- &nbsp;[site:name] team</p>'
      bodyPlain: "[easy_email:recipient_uid:0:entity:display-name],\r\n\r\nA request to reset the password for your account has been made at [site:name].\r\n\r\nYou may now log in by clicking this link or copying and pasting it into your browser:\r\n\r\n[easy_email:recipient_uid:0:entity:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it's not used.\r\n\r\n--  [site:name] team"
