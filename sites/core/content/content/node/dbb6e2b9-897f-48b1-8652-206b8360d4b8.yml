    field_body:
      -
        value: '<p>Dos de las cumbres más conocidas de las Pentland Hills, con vistas sobre Edimburgo y el estuario del Forth en un día despejado. Subimos a ritmo constante desde Flotterstone hasta Turnhouse Hill, seguimos la cresta hasta Carnethy Hill y bajamos por el valle.</p><p>Trae botas, una chaqueta impermeable, algo de abrigo, comida, tu cámara y una linterna frontal: en noviembre oscurece antes de las cinco. El camino es empinado en algunos tramos y puede haber barro.</p>'
